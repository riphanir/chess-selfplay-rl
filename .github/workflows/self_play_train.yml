name: Self-Play & Train Chess Model

on:
  # يشتغل يدويًا من تبويب Actions في GitHub وقت ما تحب
  workflow_dispatch:
    inputs:
      games:
        description: "عدد مباريات اللعب ضد النفس"
        default: "16"
      max_moves:
        description: "أقصى عدد نقلات لكل مباراة"
        default: "60"
      epsilon:
        description: "نسبة الاستكشاف العشوائي (0 إلى 1)"
        default: "0.12"
      epochs:
        description: "عدد حقب (epochs) التدريب"
        default: "3"
      time_limit:
        description: "ميزانية وقت البحث بالثانية لكل نقلة (Minimax+Alpha-Beta)"
        default: "0.5"
      search_depth:
        description: "أقصى عمق بحث (نقلات) لو الوقت سمح"
        default: "8"

  # يشتغل تلقائيًا كل 6 ساعات (عدّل الجدول زي ما تحب)
  schedule:
    - cron: "0 */6 * * *"

  # يشتغل كمان مع أي push على main (اختياري، احذفه لو مش عايزه)
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  self-play-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-play (generate games)
        run: |
          python -m src.self_play \
            --games ${{ github.event.inputs.games || '16' }} \
            --max-moves ${{ github.event.inputs.max_moves || '60' }} \
            --epsilon ${{ github.event.inputs.epsilon || '0.12' }} \
            --time-limit ${{ github.event.inputs.time_limit || '0.5' }} \
            --search-depth ${{ github.event.inputs.search_depth || '8' }}

      - name: Train on generated games
        run: |
          python -m src.train \
            --epochs ${{ github.event.inputs.epochs || '3' }}

      - name: Evaluate against baseline
        run: |
          python -m src.evaluate --games 10 --max-moves 60 \
            --time-limit ${{ github.event.inputs.time_limit || '0.5' }} \
            --search-depth ${{ github.event.inputs.search_depth || '8' }}

      - name: Update stats.csv
        run: python -m src.update_stats

      - name: Commit and push updated model & stats
        run: |
          git config user.name "chess-selfplay-bot"
          git config user.email "actions@github.com"
          git add checkpoints/model.pt checkpoints/baseline.pt stats.csv data/.gitkeep
          if git diff --cached --quiet; then
            echo "لا يوجد تغييرات لعمل commit"
          else
            git commit -m "🤖 تحديث تلقائي: تدريب جديد بعد لعب ضد النفس [skip ci]"
            git push
          fi
          
